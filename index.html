<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soccer Predictor AI Live</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #061009;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: linear-gradient(
        135deg,
        #071a0c,
        #0d2915
    );

    border-bottom: 2px solid #20e879;

    padding: 20px 15px;

    text-align: center;
}

.logo {
    color: #20ff83;
    font-size: 25px;
    font-weight: 900;
}

.subtitle {
    margin-top: 7px;
    color: #a7b5aa;
    font-size: 13px;
}

.container {
    width: 94%;
    max-width: 950px;
    margin: 18px auto;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.box {
    background: #0d1a11;
    border: 1px solid #1d432a;
    border-radius: 10px;
    padding: 12px 5px;

}

.box-title {
    color: #8c9b90;
    font-size: 11px;
}

.box-value {
    margin-top: 5px;
    color: #20ff83;
    font-size: 17px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 16px;

    border: none;
    border-radius: 11px;

    background: #20e879;
    color: #001d0b;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    margin-bottom: 12px;
}

button:active {
    transform: scale(.98);
}

.secondary {
    background: #15251a;
    color: #20ff83;
    border: 1px solid #24653a;
}

.status {
    padding: 13px;

    border-radius: 10px;

    background: #0d1b11;
    border: 1px solid #204b2d;

    text-align: center;

    margin-bottom: 15px;

    font-size: 13px;
}

.status.good {
    color: #20ff83;
}

.status.loading {
    color: #ffd45a;
}

.status.error {
    color: #ff7070;
}

.card {
    background: #0c1710;

    border: 1px solid #21472d;

    border-radius: 14px;

    padding: 16px;

    margin-bottom: 14px;
}

.league {
    color: #20ff83;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

.country {
    color: #849287;
    font-size: 11px;
    margin-bottom: 14px;
}

.teams {
    display: grid;

    grid-template-columns:
        1fr
        45px
        1fr;

    align-items: center;

    gap: 8px;
}

.team {
    text-align: center;

    font-size: 16px;

    font-weight: bold;
}

.vs {
    text-align: center;

    color: #7f8d82;

    font-size: 12px;
}

.time {
    text-align: center;

    color: #aaa;

    font-size: 11px;

    margin-top: 8px;
}

.prediction {
    background: #07170c;

    border-radius: 10px;

    margin-top: 14px;

    padding: 13px;
}

.prediction-title {
    color: #8d9b90;

    font-size: 11px;
}

.prediction-result {
    color: #20ff83;

    font-size: 20px;

    font-weight: bold;

    margin-top: 4px;
}

.confidence {
    margin-top: 8px;

    color: #ffffff;
}

.confidence span {
    color: #20ff83;

    font-size: 20px;

    font-weight: bold;
}

.probabilities {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 6px;

    margin-top: 12px;
}

.prob {
    background: #0e2114;

    border-radius: 7px;

    padding: 8px 3px;

    text-align: center;

    color: #8c998e;

    font-size: 10px;
}

.prob strong {
    display: block;

    color: #ffffff;

    font-size: 14px;

    margin-top: 3px;
}

.empty {
    padding: 30px 15px;

    text-align: center;

    color: #9ca79e;

    background: #0c1710;

    border-radius: 12px;
}

.warning {
    color: #ffd45a;

    font-size: 12px;

    margin-top: 10px;

    line-height: 1.5;
}

.footer {
    text-align: center;

    padding: 25px 10px;

    color: #566258;

    font-size: 10px;
}

@media (max-width: 500px) {

    .team {
        font-size: 14px;
    }

    .logo {
        font-size: 21px;
    }

}

</style>
</head>

    <button

        🌍 LOAD ALL UPCOMING FIXTURES

    <div

        </div>

</div>


<div class="footer">

    Soccer Predictor AI Live

    Predictions are statistical estimates

/*
==========================================================
DATE FORMAT
==========================================================
*/

function dateString(
    date
) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}

) {

        );

        amount
    );

}
