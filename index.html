<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soccer Predictor AI Live 10</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #08111f;
  color: white;
}

.header {
  padding: 25px 15px;
  text-align: center;
  background: #0d1b2f;
  border-bottom: 1px solid #243653;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.subtitle {
  margin-top: 7px;
  color: #9fb0c7;
  font-size: 14px;
}

.status {
  display: inline-block;
  margin-top: 15px;
  padding: 7px 14px;
  border-radius: 20px;
  background: #123c2b;
  color: #5dffad;
  font-size: 13px;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 15px;
}

.date {
  text-align: center;
  color: #b7c4d8;
  margin: 12px 0 18px;
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

button {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 14px 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  background: #1769ff;
  color: white;
}

button:active {
  transform: scale(.98);
}

.refresh {
  background: #25364f;
}

.system {
  text-align: center;
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 10px;
  background: #101e32;
  color: #9fb0c7;
  font-size: 13px;
}

.match {
  background: #0f1d31;
  border: 1px solid #263957;
  border-radius: 15px;
  padding: 17px;
  margin-bottom: 14px;
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  color: #91a4bf;
}

.number {
  font-weight: bold;
}

.league {
  text-align: right;
}

.teams {
  text-align: center;
  font-size: 19px;
  font-weight: bold;
  line-height: 1.7;
  margin: 15px 0 5px;
}

.vs {
  font-size: 12px;
  color: #7f92ad;
}

.match-time {
  text-align: center;
  color: #8fb5ff;
  font-size: 14px;
  margin-bottom: 15px;
}

.label {
  text-align: center;
  font-size: 10px;
  color: #8ea2bd;
  letter-spacing: 1px;
}

.prediction {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 8px 0;
}

.confidence {
  display: flex;
  justify-content: space-between;
  color: #a8b7ca;
  font-size: 12px;
  margin-top: 12px;
}

.confidence-value {
  font-weight: bold;
  color: #ffffff;
}

.bar {
  height: 7px;
  background: #26364e;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 7px;
}

.fill {
  height: 100%;
  background: #2878ff;
  border-radius: 10px;
}

.loading {
  text-align: center;
  padding: 30px 10px;
  color: #9fb0c7;
}

.error {
  text-align: center;
  padding: 20px;
  color: #ff9c9c;
}

.footer {
  text-align: center;
  padding: 25px;
  color: #64758d;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="header">

  <div class="logo">
    ⚽ Soccer Predictor AI
  </div>

  <div class="subtitle">
    Live Football Data • Daily Top 10
  </div>

  <div class="status">
    🟢 SYSTEM ONLINE
  </div>

</div>

<div class="container">

  <div id="date" class="date"></div>

  <div class="controls">

    <button onclick="generatePredictions()">
      🔮 Generate 10
    </button>

    <button class="refresh" onclick="loadFixtures()">
      🔄 Refresh
    </button>

  </div>

  <div id="system" class="system">
    Connecting to live football data...
  </div>

  <div id="predictions">

    <div class="loading">
      Loading fixtures...
    </div>

  </div>

</div>

<div class="footer">
  Soccer Predictor AI Live 10
  <br>
  Live fixture data powered by API-Sports
</div>

<script>

const API_URL =
  "https://soccer-predictor-ai-1.onrender.com";

let fixtures = [];


/* =========================
   DATE
========================= */

function updateDate() {

  document.getElementById("date").textContent =
    new Date().toLocaleDateString(
      undefined,
      {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );

}


/* =========================
   LOAD LIVE FIXTURES
========================= */

async function loadFixtures() {

  const container =
    document.getElementById("predictions");

  const system =
    document.getElementById("system");

  system.textContent =
    "🔄 Connecting to API-Sports...";

  container.innerHTML = `
    <div class="loading">
      Loading live fixtures...
    </div>
  `;

  try {

    const response =
      await fetch(
        `${API_URL}/api/fixtures`
      );

    if (!response.ok) {

      throw new Error(
        "Server returned " +
        response.status
      );

    }

    const data =
      await response.json();

    if (
      !data.response ||
      data.response.length === 0
    ) {

      fixtures = [];

      container.innerHTML = `
        <div class="loading">
          No upcoming fixtures found.
        </div>
      `;

      system.textContent =
        "🟡 No fixtures returned";

      return;
    }

    fixtures = data.response;

    system.textContent =
      `🟢 Live data connected • ${fixtures.length} fixtures found`;

    renderFixtures(
      fixtures.slice(0, 10)
    );

  }

  catch (error) {

    console.error(error);

    system.textContent =
      "🔴 Unable to connect to live data";

    container.innerHTML = `
      <div class="error">
        ⚠️ Could not load live fixtures.
        <br><br>
        Tap Refresh to try again.
      </div>
    `;

  }

}


/* =========================
   GENERATE TOP 10
========================= */

function generatePredictions() {

  if (!fixtures.length) {

    loadFixtures();

    return;
  }

  const selected =
    fixtures.slice(0, 10);

  renderFixtures(selected);

}


/* =========================
   RENDER MATCHES
========================= */

function renderFixtures(list) {

  const container =
    document.getElementById(
      "predictions"
    );

  container.innerHTML = "";

  list.forEach(
    (fixture, index) => {

      const home =
        fixture.teams.home.name;

      const away =
        fixture.teams.away.name;

      const league =
        fixture.league.name;

      const date =
        new Date(
          fixture.fixture.date
        );

      const time =
        date.toLocaleTimeString(
          [],
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      const card =
        document.createElement("div");

      card.className =
        "match";

      card.innerHTML = `

        <div class="top">

          <span class="number">
            MATCH ${index + 1}
          </span>

          <span class="league">
            ${escapeHTML(league)}
          </span>

        </div>

        <div class="teams">

          ${escapeHTML(home)}

          <br>

          <span class="vs">
            VS
          </span>

          <br>

          ${escapeHTML(away)}

        </div>

        <div class="match-time">

          🕐 ${time}

        </div>

        <div class="label">
          FIXTURE DATA
        </div>

        <div class="prediction">

          Awaiting prediction model

        </div>

        <div class="confidence">

          <span>
            Live fixture
          </span>

          <span class="confidence-value">
            DATA
          </span>

        </div>

        <div class="bar">

          <div
            class="fill"
            style="width:100%">
          </div>

        </div>

      `;

      container.appendChild(card);

    }
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   START APP
========================= */

updateDate();

loadFixtures();

</script>

</body>
</html>
