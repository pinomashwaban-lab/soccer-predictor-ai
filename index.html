<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="AI-powered soccer predictions, daily match insights and football statistics.">
  <link rel="manifest" href="manifest.json">

  <title>Soccer Predictor AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      background: #0b1729;
      border-bottom: 1px solid #1b304b;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 18px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    h1 {
      margin: 12px 0 5px;
      font-size: 25px;
    }

    .subtitle {
      color: #9eb1c8;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #123d2a;
      color: #51e69a;
      font-size: 12px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 18px 14px 40px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #generateBtn {
      background: #18a566;
      color: white;
    }

    #refreshBtn {
      background: #17283e;
      color: white;
      border: 1px solid #29435f;
    }

    button:active {
      transform: scale(0.98);
    }

    .date-box {
      background: #0b1729;
      border: 1px solid #1b304b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
      color: #b7c7d9;
    }

    .prediction-list {
      display: grid;
      gap: 14px;
    }

    .card {
      background: #0b1729;
      border: 1px solid #1b304b;
      border-radius: 16px;
      padding: 17px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    }
