<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soccer Predictor AI Live</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07130d;
    color: #ffffff;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: auto;
}

header {
    text-align: center;
    padding: 28px 10px 18px;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.subtitle {
    color: #9ee6b8;
    margin-top: 8px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 15px 0;
}

.card {
    background: #10251a;
    border: 1px solid #285438;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
}

.card-title {
    color: #9ee6b8;
    font-size: 13px;
}

.card-value {
    font-size: 24px;
    font-weight: bold;
    margin-top: 5px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 15px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #20c76a;
    color: #041108;
}

.status {
    background: #0d2015;
    border: 1px solid #285438;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 20px;
}

.predictions {
    display: grid;
    gap: 15px;
}

.match {
    background: #10251a;
    border: 1px solid #285438;
    border-radius: 14px;
    padding: 18px;
}

.match-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: #9ee6b8;
    font-size: 13px;
    margin-bottom: 12px;
}

.teams {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin: 12px 0;
}

.prediction {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin: 12px 0;
}

.details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.detail {
    background: #07130d;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-size: 12px;
}

footer {
    text-align: center;
    color: #6fa382;
    font-size: 12px;
    padding: 30px 10px;
}

@media (max-width: 650px) {
    .dashboard {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    .teams {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">⚽ SOCCER PREDICTOR AI LIVE</div>

    <div class="subtitle">
        🌍 Global Football • All Available Leagues
    </div>
</header>


<section class="dashboard">

    <div class="card">
        <div class="card-title">FIXTURES</div>
        <div class="card-value" id="fixtureCount">0</div>
    </div>

    <div class="card">
        <div class="card-title">LEAGUES</div>
        <div class="card-value" id="leagueCount">0</div>
    </div>

    <div class="card">
        <div class="card-title">STATUS</div>
        <div class="card-value" id="status">READY</div>
    </div>

</section>


<div class="buttons">

    <button onclick="loadFixtures()">
        🌍 Load All Upcoming Fixtures
    </button>

    <button onclick="generatePredictions()">
        🤖 Generate Predictions
    </button>

</div>


<div class="status" id="message">
    🔄 Connecting to live football data...
</div>


<div class="predictions" id="predictions"></div>


<footer>
    Predictions are statistical estimates and are not guaranteed results.
</footer>

</div>


<script>

/*
=========================================================
SOCCER PREDICTOR AI LIVE
PRIVATE API ARCHITECTURE
=========================================================

The API key is NOT stored in this website.

GitHub Actions uses the private API key and creates:

data/fixtures.json

This website only reads that public data file.
=========================================================
*/


const FIXTURE_FILE = "./data/fixtures.json";

let fixtures = [];

let lastUpdated = null;


/*
=========================================================
LOAD FIXTURES
=========================================================
*/

async function loadFixtures() {

    const message =
        document.getElementById("message");

    const status =
        document.getElementById("status");

    message.textContent =
        "🔄 Loading live football fixtures...";

    status.textContent =
        "LOADING";


    try {

        const response = await fetch(
            FIXTURE_FILE +
            "?cache=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status +
                " - " +
                response.statusText
            );

        }


        const data =
            await response.json();


        if (!data) {

            throw new Error(
                "The fixture file returned no data."
            );

        }


        if (!Array.isArray(data.fixtures)) {

            throw new Error(
                "The fixture file does not contain a fixtures array."
            );

        }


        fixtures =
            data.fixtures;


        lastUpdated =
            data.updated || null;


        updateDashboard();


        if (fixtures.length === 0) {

            status.textContent =
                "EMPTY";

            message.textContent =
                "⚠️ The live feed is connected, but no upcoming fixtures were returned.";

            return;

        }


        status.textContent =
            "LIVE";


        let updateText =
            "🟢 Live football data loaded successfully.";


        if (lastUpdated) {

            updateText +=
                " Updated: " +
                new Date(lastUpdated)
                    .toLocaleString();

        }


        message.textContent =
            updateText;


        /*
        Automatically show predictions
        after fixtures load.
        */

        generatePredictions();


    }


    catch (error) {

        console.error(
            "Fixture loading error:",
            error
        );


        fixtures = [];


        updateDashboard();


        status.textContent =
            "ERROR";


        message.innerHTML =
            "❌ Could not load live fixtures.<br><br>" +
            "<small>" +
            escapeHtml(error.message) +
            "</small>";

    }

}


/*
=========================================================
UPDATE DASHBOARD
=========================================================
*/

function updateDashboard() {

    document.getElementById(
        "fixtureCount"
    ).textContent =
        fixtures.length;


    const leagues =
        new Set();


    fixtures.forEach(
        fixture => {

            const league =
                fixture.league &&
                fixture.league.name
                    ? fixture.league.name
                    : "Unknown League";


            leagues.add(
                league
            );

        }
    );


    document.getElementById(
        "leagueCount"
    ).textContent =
        leagues.size;

}


/*
=========================================================
GENERATE PREDICTIONS
=========================================================
*/

function generatePredictions() {

    if (!fixtures.length) {

        document.getElementById(
            "message"
        ).textContent =
            "⚠️ No fixtures are available yet.";

        return;

    }


    /*
    Select up to 20 fixtures.

    The fixture source can contain
    hundreds of matches.
    */

    const selected =
        shuffleArray(
            [...fixtures]
        ).slice(
            0,
            20
        );


    renderPredictions(
        selected
    );


    document.getElementById(
        "message"
    ).textContent =
        "🤖 Predictions generated for " +
        selected.length +
        " upcoming matches.";

}


/*
=========================================================
PREDICTION ENGINE
=========================================================

This is currently a demonstration prediction engine.
It does NOT claim 98% real-world accuracy.

Later we can replace this with a real statistical model.
=========================================================
*/

function makePrediction() {

    const outcomes = [

        "HOME WIN",

        "DRAW",

        "AWAY WIN"

    ];


    const outcome =
        outcomes[
            Math.floor(
                Math.random() *
                outcomes.length
            )
        ];


    const confidence =
        Math.floor(
            70 +
            Math.random() *
            27
        );


    return {

        outcome:
            outcome,

        confidence:
            confidence

    };

}


/*
=========================================================
RENDER PREDICTIONS
=========================================================
*/

function renderPredictions(
    list
) {

    const container =
        document.getElementById(
            "predictions"
        );


    container.innerHTML =
        "";


    list.forEach(
        fixture => {

            const home =
                fixture.teams &&
                fixture.teams.home &&
                fixture.teams.home.name
                    ? fixture.teams.home.name
                    : "Home Team";


            const away =
                fixture.teams &&
                fixture.teams.away &&
                fixture.teams.away.name
                    ? fixture.teams.away.name
                    : "Away Team";


            const league =
                fixture.league &&
                fixture.league.name
                    ? fixture.league.name
                    : "Unknown League";


            const country =
                fixture.league &&
                fixture.league.country
                    ? fixture.league.country
                    : "";


            const prediction =
                makePrediction();


            let matchDate =
                "Time unavailable";


            if (
                fixture.fixture &&
                fixture.fixture.date
            ) {

                matchDate =
                    new Date(
                        fixture.fixture.date
                    ).toLocaleString();

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "match";


            card.innerHTML = `

                <div class="match-header">

                    <span>
                        🌍 ${escapeHtml(country)}
                    </span>

                    <span>
                        ${escapeHtml(league)}
                    </span>

                </div>


                <div class="teams">

                    ${escapeHtml(home)}

                    <br>

                    <span style="font-size:13px;">
                        VS
                    </span>

                    <br>

                    ${escapeHtml(away)}

                </div>


                <div class="prediction">

                    🤖 ${prediction.outcome}

                </div>


                <div class="details">

                    <div class="detail">

                        CONFIDENCE

                        <br>

                        <strong>
                            ${prediction.confidence}%
                        </strong>

                    </div>


                    <div class="detail">

                        MATCH TIME

                        <br>

                        <strong>
                            ${escapeHtml(matchDate)}
                        </strong>

                    </div>


                    <div class="detail">

                        STATUS

                        <br>

                        <strong>
                            UPCOMING
                        </strong>

                    </div>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/*
=========================================================
SHUFFLE
=========================================================
*/

function shuffleArray(
    array
) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/*
=========================================================
SECURITY
=========================================================
*/

function escapeHtml(
    value
) {

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/*
=========================================================
START APPLICATION
=========================================================
*/

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadFixtures();

    }
);

</script>

</body>
</html>
