<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Predictor AI Live</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07110b;
    color: white;
}

header {
    background: #0d1f13;
    padding: 18px;
    text-align: center;
    border-bottom: 2px solid #18d66b;
}

h1 {
    margin: 0;
    color: #18ff78;
    font-size: 25px;
}

.subtitle {
    color: #aaa;
    margin-top: 6px;
    font-size: 13px;
}

.container {
    width: 94%;
    max-width: 900px;
    margin: 18px auto;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #18d66b;
    color: #001b09;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}

button:active {
    transform: scale(.98);
}

.status {
    background: #101c14;
    border: 1px solid #244a32;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
}

.card {
    background: #101a13;
    border: 1px solid #23462f;
    border-radius: 14px;
    padding: 17px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

.league {
    color: #18ff78;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 10px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
}

.vs {
    color: #888;
    font-size: 12px;
}

.prediction {
    margin-top: 15px;
    padding: 13px;
    border-radius: 10px;
    background: #071b0e;
}

.prediction strong {
    color: #18ff78;
}
