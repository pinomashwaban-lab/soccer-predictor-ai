<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soccer Predictor AI Live</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07130d;
    color: #ffffff;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: auto;
}

header {
    text-align: center;
    padding: 28px 10px 18px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
}

.subtitle {
    color: #9ee6b8;
    margin-top: 8px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 15px 0;
}

.card {
    background: #10251a;
    border: 1px solid #285438;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
}

.card-title {
    color: #9ee6b8;
    font-size: 13px;
}

.card-value {
    font-size: 24px;
    font-weight: bold;
    margin-top: 5px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 15px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #20c76a;
    color: #041108;
}

button:hover {
    opacity: 0.9;
}

.status {
    background: #0d2015;
    border: 1px solid #285438;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 20px;
}

.predictions {
    display: grid;
    gap: 15px;
}

.match {
    background: #10251a;
    border: 1px solid #285438;
    border-radius: 14px;
    padding: 18px;
}

.match-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: #9ee6b8;
    font-size: 13px;
    margin-bottom: 12px;
}

.teams {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin: 12px 0;
}

.prediction {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin: 12px 0;
}

.details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.detail {
    background: #07130d;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-size: 13px;
}

footer {
    text-align: center;
    color: #6fa382;
    font-size: 12px;
    padding: 30px 10px;
}

@media (max-width: 650px) {
    .dashboard {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    .teams {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">⚽ SOCCER PREDICTOR AI LIVE</div>
    <div class="subtitle">
        🌍 Global Football • All Available Leagues
    </div>
</header>

<section class="dashboard">

    <div class="card">
        <div class="card-title">FIXTURES</div>
        <div class="card-value" id="fixtureCount">0</div>
    </div>

    <div class="card">
        <div class="card-title">LEAGUES</div>
        <div class="card-value" id="leagueCount">0</div>
    </div>

    <div class="card">
        <div class="card-title">STATUS</div>
        <div class="card-value" id="status">READY</div>
    </div>

</section>

<div class="buttons">

    <button onclick="loadFixtures()">
        🌍 Load All Upcoming Fixtures
    </button>

    <button onclick="generatePredictions()">
        🤖 Generate Predictions
    </button>

</div>

<div class="status" id="message">
    Loading live football data...
</div>

<div class="predictions" id="predictions"></div>

<footer>
    Predictions are statistical estimates and are not guaranteed results.
</footer>

</div>

<script>

let fixtures = [];

const FIXTURE_FILE = "data/fixtures.json";

async function loadFixtures() {

    const message = document.getElementById("message");

    message.textContent = "🔄 Loading live fixtures...";

    document.getElementById("status").textContent = "LOADING";

    try {

        const response = await fetch(
            FIXTURE_FILE + "?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "Fixture file could not be loaded."
            );
        }

        const data = await response.json();

        fixtures = Array.isArray(data.fixtures)
            ? data.fixtures
            : [];

        updateDashboard();

        if (fixtures.length === 0) {

            message.textContent =
                "⚠️ No upcoming fixtures were returned.";

            document.getElementById("status")
                .textContent = "EMPTY";

            return;
        }

        message.textContent =
            "🟢 Live fixture data loaded successfully.";

        document.getElementById("status")
            .textContent = "LIVE";

    } catch (error) {

        console.error(error);

        fixtures = [];

        updateDashboard();

        document.getElementById("status")
            .textContent = "ERROR";

        message.textContent =
            "❌ Could not load live fixtures. Please try again.";

    }
}


function updateDashboard() {

    document.getElementById("fixtureCount")
        .textContent = fixtures.length;

    const leagues = new Set();

    fixtures.forEach(fixture => {

        const league =
            fixture.league &&
            fixture.league.name
                ? fixture.league.name
                : "Unknown";

        leagues.add(league);

    });

    document.getElementById("leagueCount")
        .textContent = leagues.size;
}


function generatePredictions() {

    if (!fixtures.length) {

        document.getElementById("message")
            .textContent =
            "⚠️ Load live fixtures first.";

        return;
    }

    const selected = [...fixtures]
        .sort(() => Math.random() - 0.5)
        .slice(0, 20);

    renderPredictions(selected);

    document.getElementById("message")
        .textContent =
        "🤖 Predictions generated from the available fixtures.";

}


function makePrediction() {

    const outcomes = [
        "HOME WIN",
        "DRAW",
        "AWAY WIN"
    ];

    const outcome =
        outcomes[
            Math.floor(
                Math.random() * outcomes.length
            )
        ];

    const confidence =
        Math.floor(
            70 + Math.random() * 27
        );

    return {
        outcome,
        confidence
    };
}


function renderPredictions(list) {

    const container =
        document.getElementById("predictions");

    container.innerHTML = "";

    list.forEach(fixture => {

        const home =
            fixture.teams &&
            fixture.teams.home &&
            fixture.teams.home.name
                ? fixture.teams.home.name
                : "Home Team";

        const away =
            fixture.teams &&
            fixture.teams.away &&
            fixture.teams.away.name
                ? fixture.teams.away.name
                : "Away Team";

        const league =
            fixture.league &&
            fixture.league.name
                ? fixture.league.name
                : "Unknown League";

        const country =
            fixture.league &&
            fixture.league.country
                ? fixture.league.country
                : "";

        const prediction =
            makePrediction();

        const matchDate =
            fixture.fixture &&
            fixture.fixture.date
                ? new Date(
                    fixture.fixture.date
                  ).toLocaleString()
                : "Time unavailable";

        const card =
            document.createElement("div");

        card.className = "match";

        card.innerHTML = `

            <div class="match-header">

                <span>
                    ${escapeHtml(country)}
                </span>

                <span>
                    ${escapeHtml(league)}
                </span>

            </div>

            <div class="teams">

                ${escapeHtml(home)}

                <br>

                VS

                <br>

                ${escapeHtml(away)}

            </div>

            <div class="prediction">

                🤖 ${prediction.outcome}

            </div>

            <div class="details">

                <div class="detail">

                    CONFIDENCE

                    <br>

                    <strong>
                        ${prediction.confidence}%
                    </strong>

                </div>

                <div class="detail">

                    MATCH TIME

                    <br>

                    <strong>
                        ${escapeHtml(matchDate)}
                    </strong>

                </div>

                <div class="detail">

                    STATUS

                    <br>

                    <strong>
                        UPCOMING
                    </strong>

                </div>

            </div>

        `;

        container.appendChild(card);

    });

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadFixtures();

    }
);

</script>

</body>
</html>
