<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Predictor AI</title>
<title>Soccer Predictor AI</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#07111f;
color:white;
}

.app{
max-width:700px;
margin:auto;
padding-bottom:40px;
}

header{
text-align:center;
padding:28px 18px;
background:#0b192d;
border-bottom:1px solid #1d3554;
}

.logo{font-size:40px}

h1{
font-size:24px;
margin:8px 0;
}

.subtitle{
color:#91a4bd;
font-size:13px;
}

.status{
margin:18px;
padding:16px;
text-align:center;
background:#0d2038;
border:1px solid #1d4168;
border-radius:14px;
}

.online{
color:#32d583;
font-weight:bold;
}

.dot{
display:inline-block;
width:9px;
height:9px;
background:#32d583;
border-radius:50%;
margin-right:6px;
}

.date{
margin-top:7px;
color:#91a4bd;
font-size:12px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:0 18px 18px;
}

button{
border:none;
border-radius:12px;
padding:14px;
color:white;
font-weight:bold;
background:#1769e0;
}

.refresh{
background:#152941;
}

.title{
padding:5px 18px 14px;
font-size:18px;
font-weight:bold;
}

.match{
margin:0 18px 14px;
padding:17px;
background:#0c1b2f;
border:1px solid #1d3554;
border-radius:16px;
}

.top{
display:flex;
justify-content:space-between;
margin-bottom:12px;
}

.number{
color:#6f8ba8;
font-size:12px;
font-weight:bold;
}

.league{
color:#91a4bd;
font-size:11px;
}

.teams{
font-size:17px;
font-weight:bold;
line-height:1.5;
margin-bottom:14px;
}

.vs{
color:#7189a4;
font-size:12px;
}

.label{
color:#91a4bd;
font-size:11px;
}

.prediction{
font-size:19px;
font-weight:bold;
margin:6px 0 12px;
}

.confidence{
display:flex;
justify-content:space-between;
font-size:12px;
margin-bottom:7px;
}

.confidence-value{
color:#32d583;
font-weight:bold;
}

.bar{
height:7px;
background:#172b43;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
background:#2dd58c;
}

.info{
margin:20px 18px;
padding:16px;
background:#0b192d;
border:1px solid #1d3554;
border-radius:14px;
}

.info h3{
margin-bottom:8px;
}

.info p{
color:#91a4bd;
font-size:12px;
line-height:1.6;
}

footer{
text-align:center;
color:#50677f;
font-size:11px;
}

</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">⚽</div>
<h1>Soccer Predictor AI</h1>
<div class="subtitle">AI Football Prediction Dashboard</div>
</header>

<div class="status">

<div>
<span class="dot"></span>
<span class="online">SYSTEM ONLINE</span>
</div>

<div class="date" id="date"></div>

</div>

<div class="buttons">

<button onclick="generatePredictions()">
🔮 Generate 10
</button>

<button class="refresh" onclick="generatePredictions()">
🔄 Refresh
</button>

</div>

<div class="title">
Today's Predictions
</div>

<div id="predictions"></div>

<div class="info">

<h3>🤖 AI Prediction Engine</h3>

<p>
Generates 10 football prediction cards
with prediction types and confidence
percentages. Live football data will be
connected in the next version.
</p>

</div>

<footer>
Soccer Predictor AI v1.0
</footer>

</div>

<script>

const matches=[

["Manchester City","Arsenal","Premier League"],
["Liverpool","Chelsea","Premier League"],
["Manchester United","Tottenham","Premier League"],
["Real Madrid","Barcelona","La Liga"],
["Atletico Madrid","Sevilla","La Liga"],
["Bayern Munich","Dortmund","Bundesliga"],
["Leverkusen","RB Leipzig","Bundesliga"],
["Inter Milan","AC Milan","Serie A"],
["Juventus","Napoli","Serie A"],
["PSG","Lyon","Ligue 1"],
["Ajax","PSV","Eredivisie"],
["Porto","Benfica","Primeira Liga"],
["Sporting CP","Braga","Primeira Liga"],
["River Plate","Boca Juniors","Argentina"],
["Al Ahly","Zamalek","Egypt"]

];

const predictionTypes=[

"Home Win",
"Draw",
"Away Win",
"Over 1.5 Goals",
"Over 2.5 Goals",
"Both Teams To Score"

];

function generatePredictions(){

const container=document.getElementById("predictions");

container.innerHTML="";

const selected=[...matches]
.sort(()=>Math.random()-0.5)
.slice(0,10);

selected.forEach((match,index)=>{

const prediction=
predictionTypes[
Math.floor(Math.random()*predictionTypes.length)
];

const confidence=
Math.floor(Math.random()*16)+72;

const card=document.createElement("div");

card.className="match";

card.innerHTML=`

<div class="top">

<span class="number">
MATCH ${index+1}
</span>

<span class="league">
${match[2]}
</span>

</div>

<div class="teams">

${match[0]}

<br>

<span class="vs">VS</span>

<br>

${match[1]}

</div>

<div class="label">
AI PREDICTION
</div>

<div class="prediction">
${prediction}
</div>

<div class="confidence">

<span>AI Confidence</span>

<span class="confidence-value">
${confidence}%
</span>

</div>

<div class="bar">

<div
class="fill"
style="width:${confidence}%">
</div>

</div>

`;

container.appendChild(card);

});

}

document.getElementById("date").textContent=
new Date().toLocaleDateString(
undefined,
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
);

generatePredictions();

</script>

</body>
</html>
