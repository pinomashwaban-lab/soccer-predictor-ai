body {

}

header {

}

.container {

}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.box {

}

button {

    padding: 16px;
    border: none;
    border-radius: 11px;
    background: #20e879;
    color: #001d0b;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}

button:active {
    transform: scale(.98);
}

.secondary {
    background: #15251a;
    color: #20ff83;
    border: 1px solid #24653a;
}

.status {
    padding: 13px;
    border-radius: 10px;

    margin-bottom: 15px;

}

.status.loading {
    color: #ffd45a;
}

.status.error {
    color: #ff7070;
}

.card {
    background: #0c1710;
    border: 1px solid #21472d;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
}

.league {
    color: #20ff83;

    font-size: 13px;

.country {

}

.teams {

    gap: 8px;
}

.team {

    font-size: 16px;
    font-weight: bold;
}

.vs {
    text-align: center;
    color: #7f8d82;
    font-size: 12px;
}

.time {
    text-align: center;
    color: #aaa;
    font-size: 11px;
    margin-top: 8px;
}

.prediction {
    background: #07170c;

    margin-top: 14px;
    padding: 13px;
}

.prediction-title {
    color: #8d9b90;
    font-size: 11px;
}

.prediction-result {
    color: #20ff83;
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
}

.confidence {
    margin-top: 8px;
    color: #ffffff;
}

.confidence span {
    color: #20ff83;
    font-weight: bold;
    font-size: 20px;
}

.probabilities {

    gap: 6px;
    margin-top: 12px;
}
