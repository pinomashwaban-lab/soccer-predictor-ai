name: Update Football Fixtures

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch upcoming global fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          key = os.environ.get("API_FOOTBALL_KEY")

          if not key:
              print("ERROR: API_FOOTBALL_KEY secret is missing.")
              sys.exit(1)

          tz = ZoneInfo("Africa/Johannesburg")

          today = datetime.now(tz).date()
          from_date = today.strftime("%Y-%m-%d")
          to_date = (today + timedelta(days=7)).strftime("%Y-%m-%d")

          base_url = "https://v3.football.api-sports.io/fixtures"

          fixtures = []
          seen = set()

          page = 1
          max_pages = 10

          while page <= max_pages:

              params = {
                  "from": from_date,
                  "to": to_date,
                  "timezone": "Africa/Johannesburg",
                  "page": page
              }

              url = base_url + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": key,
                      "Accept": "application/json"
                  },
                  method="GET"
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read().decode("utf-8")
                      data = json.loads(body)

              except Exception as error:
                  print(f"ERROR requesting page {page}: {error}")
                  sys.exit(1)

              errors = data.get("errors") or {}
              results = data.get("results", 0)
              paging = data.get("paging") or {}

              print(
                  f"Page {page}: "
                  f"results={results}, "
                  f"paging={paging}, "
                  f"errors={errors}"
              )

              if errors:
                  print("API-FOOTBALL ERROR:")
                  print(json.dumps(errors, indent=2))
                  sys.exit(1)

              for item in data.get("response", []):

                  fixture_data = item.get("fixture", {})

                  fixture_id = fixture_data.get("id")

                  if fixture_id is not None:

                      if fixture_id not in seen:
                          seen.add(fixture_id)
                          fixtures.append(item)

              total_pages = int(
                  paging.get("total", 1) or 1
              )

              if page >= total_pages:
                  break

              page += 1

          if total_pages > max_pages:
              print(
                  f"WARNING: API reports {total_pages} pages. "
                  f"Only the first {max_pages} pages were downloaded."
              )

          fixtures.sort(
              key=lambda item:
              item.get("fixture", {}).get("timestamp", 0)
          )

          output = {
              "updated": datetime.now(tz).isoformat(),
              "from": from_date,
              "to": to_date,
              "count": len(fixtures),
              "fixtures": fixtures
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/fixtures.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("======================================")
          print("SOCCER PREDICTOR AI FIXTURE UPDATE")
          print("======================================")
          print(f"Date range: {from_date} to {to_date}")
          print(f"Pages downloaded: {page}")
          print(f"Saved fixtures: {len(fixtures)}")
          print("======================================")

          PY

      - name: Commit updated fixtures
        run: |
          git config user.name "Soccer Predictor AI"
          git config user.email "actions@github.com"

          git add data/fixtures.json

          if git diff --cached --quiet; then
            echo "No fixture changes."
          else
            git commit -m "Update live football fixtures"
            git push
          fi
